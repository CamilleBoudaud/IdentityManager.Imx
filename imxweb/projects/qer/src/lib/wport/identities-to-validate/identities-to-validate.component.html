<h2 class="mat-headline-5">{{ '#LDS#Identités à valider' | translate }}</h2>

@if (isLoading) {
  <imx-busy-indicator></imx-busy-indicator>
} @else if (rows.length === 0) {
  <p data-imx-identifier="identities-to-validate-empty">{{ '#LDS#There are currently no identities awaiting approval.' | translate }}</p>
} @else {
  <mat-card class="imx-identities-to-validate-card">
    @for (row of rows; track row.identity.GetEntity().GetKeys()[0]) {
      <button
        mat-button
        class="imx-identities-to-validate-row"
        data-imx-identifier="identities-to-validate-row"
        (click)="openIdentity(row)"
      >
        <span class="imx-identities-to-validate-name">
          <span
            class="imx-identities-to-validate-bullet"
            [ngClass]="'imx-identities-to-validate-bullet-' + row.approvalStateColor"
            [attr.title]="row.approvalStateLabel | translate"
          ></span>
          {{ row.identity.GetEntity().GetDisplay() }}
        </span>
        <span class="imx-identities-to-validate-state">{{ row.approvalStateLabel | translate }}</span>
      </button>
    }
  </mat-card>
}
